name: Test & Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Step 1: Test. Nothing gets released unless this job passes.
  # The job also reads the version from Cargo.toml ([package] version is
  # the single source of truth) and checks whether it has been released.
  # ------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_exists: ${{ steps.tagcheck.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to detect already-published versions

      - name: Read version from Cargo.toml
        id: version
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version in Cargo.toml: '$VERSION' (expected X.Y.Z)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release tag already exists
        id: tagcheck
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists — nothing new to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies (GTK4 / Libadwaita)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Install cargo-tarpaulin (pinned + checksummed)
        run: |
          TARPAULIN_VERSION="0.37.2"
          TARPAULIN_SHA256="837dc54d21da101e96e888c6fd25f3c06554b0614880ea385cdf68cd5173"
          curl -sSL "https://github.com/xd009642/tarpaulin/releases/download/${TARPAULIN_VERSION}/cargo-tarpaulin-x86_64-unknown-linux-musl.tar.gz" -o tarpaulin.tar.gz
          echo "${TARPAULIN_SHA256}  tarpaulin.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf tarpaulin.tar.gz -C "$HOME/.cargo/bin/"
          rm tarpaulin.tar.gz

      - name: Code coverage (fail under 35%)
        run: cargo tarpaulin --fail-under 35

  # ------------------------------------------------------------------
  # Step 2: Release. Runs only after tests pass, only for pushes to the
  # default branch (never for pull requests), and only when the version
  # in Cargo.toml has not been released yet.
  # ------------------------------------------------------------------
  release:
    name: Release
    needs: test
    if: >-
      github.event_name == 'push' &&
      needs.test.outputs.tag_exists == 'false' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (GTK4 / Libadwaita)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Strip binary
        run: strip target/release/bubblegum

      - name: Package artifacts
        run: |
          VERSION="${{ needs.test.outputs.version }}"
          mkdir -p dist
          cp target/release/bubblegum dist/
          cp data/com.github.Bubblegum.desktop dist/
          cp README.md LICENSE dist/
          tar -czf "bubblegum-${VERSION}-x86_64-linux.tar.gz" -C dist \
            bubblegum com.github.Bubblegum.desktop README.md LICENSE

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.test.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            "bubblegum-${VERSION}-x86_64-linux.tar.gz"
