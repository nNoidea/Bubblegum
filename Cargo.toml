[package]
name = "bubblegum"
version = "0.1.5"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.45", features = ["serde"] }
fuzzy-matcher = "0.3.7"
gtk4 = "0.11.3"
libadwaita = { version = "0.9.1", features = ["v1_5"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.52.3", features = ["full"] }
